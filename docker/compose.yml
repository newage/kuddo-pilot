name: kuddo-pilot

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is not set}
      AUTH_TRUST_HOST: "true"
      HOME: /tmp
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kuddo
      POSTGRES_PASSWORD: kuddo
      POSTGRES_DB: kuddo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuddo -d kuddo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  node_modules:
  next_cache:
  pgdata:
